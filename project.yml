name: Entrain
options:
  bundleIdPrefix: no.espenbye
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: true

# The session, audio, modes, intents and widget snapshot are shared by every
# app. Each platform adds its own shell under Sources/App and Sources/UI.
targetTemplates:
  SharedApp:
    type: application
    sources:
      - Sources/Session
      - Sources/Audio
      - Sources/Adaptive
      - Sources/Haptics
      - Sources/Health
      - Sources/UI/PlayerView.swift
      - Sources/UI/BodySection.swift
      - Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The widget shares the mode enums, the intents behind its buttons and the
  # snapshot it draws; WIDGET compiles the intents without the session.
  SharedWidget:
    type: app-extension
    sources:
      - Widget/EntrainWidget.swift
      - Widget/WakeActivity.swift
      - Widget/SessionActivity.swift
      - Sources/Session/Mode.swift
      - Sources/Session/WakeAlarmMetadata.swift
      - Sources/Session/SessionActivityAttributes.swift
      - Sources/Session/WidgetState.swift
      - Sources/Session/Intents.swift
      - Resources/Localizable.xcstrings
    info:
      properties:
        CFBundleDisplayName: Entrain
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG WIDGET
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET

targets:
  Entrain:
    templates: [SharedApp]
    platform: macOS
    sources:
      - Sources/App/macOS
      - Sources/UI/macOS
      - Sources/UI/PlayerScreen.swift
      - Sources/UI/SettingsScreen.swift
      - Sources/UI/IntensityQuestion.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Entrain
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSMotionUsageDescription: Turns the room with your head when Head Tracking is on.
        CFBundleURLTypes:
          - CFBundleURLName: no.espenbye.entrain
            CFBundleURLSchemes: [entrain]
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHumanReadableCopyright: © Espen Bye
        NSLocationWhenInUseUsageDescription: Follows local sunrise and sunset. Only an approximate location is used, and it never leaves the Mac.
        NSLocationDefaultAccuracyReduced: true
    entitlements:
      path: Entrain.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.location: true
        # The widget snapshot. An App Group would need a certificate to sign,
        # and App Review rejects this exception: a Mac App Store archive passes
        # CODE_SIGN_ENTITLEMENTS=AppStore/$(TARGET_NAME).entitlements instead.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/Entrain/
        # No iCloud key-value store here: like an App Group it needs a
        # certificate to sign, so the Mac only syncs settings from an
        # archive signed with AppStore/Entrain.entitlements.
    dependencies:
      - target: EntrainWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.entrain
        PRODUCT_NAME: Entrain
        ENABLE_HARDENED_RUNTIME: true

  EntrainWidget:
    templates: [SharedWidget]
    platform: macOS
    info:
      path: Widget/Info.plist
    entitlements:
      path: Widget/EntrainWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/Entrain/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.entrain.widget
        ENABLE_HARDENED_RUNTIME: true

  # iPhone and iPad. Same bundle id as the Mac app for universal purchase.
  # The widget and the app share the snapshot through an App Group, which
  # the iOS sandbox has no path exception to replace.
  EntrainiOS:
    templates: [SharedApp]
    platform: iOS
    sources:
      - Sources/App/iOS
      - Sources/UI/PlayerScreen.swift
      - Sources/UI/SettingsScreen.swift
      - Sources/UI/IntensityQuestion.swift
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Entrain
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        CFBundleURLTypes:
          - CFBundleURLName: no.espenbye.entrain
            CFBundleURLSchemes: [entrain]
        UIBackgroundModes: [audio]
        NSHealthUpdateUsageDescription: Entrain logs Meditate sessions as mindful minutes.
        NSHealthShareUsageDescription: Entrain reads your recent sleep so Wind Down and the sleep beds follow your own bedtime, and your resting heart rate and heart rate variability so it can tell an ordinary day from a tired one. Nothing leaves the device.
        NSAlarmKitUsageDescription: Rings the Wake alarm at the time you choose, even on silent.
        NSLocationWhenInUseUsageDescription: Follows local sunrise and sunset. Only an approximate location is used, and it never leaves the device.
        NSLocationDefaultAccuracyReduced: true
        NSMotionUsageDescription: Turns the room with your head when Head Tracking is on.
        NSSupportsLiveActivities: true
        # The backdrop's top colour, so launch does not flash white before the dark UI.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
    entitlements:
      path: iOS/Entrain.entitlements
      properties:
        com.apple.security.application-groups: [group.no.espenbye.entrain]
        com.apple.developer.healthkit: true
        # This key enumerates clinical health record types, not ordinary read
        # types: sleep, heart rate and variability are asked for at runtime
        # and declared in NSHealthShareUsageDescription, not here. Entrain
        # reads no health records, so it stays empty.
        com.apple.developer.healthkit.access: []
        # No iCloud key-value store: personal teams cannot provision it, so
        # settings sync comes from an archive signed with AppStore/EntrainiOS.entitlements.
    dependencies:
      - target: EntrainWidgetiOS
      - target: EntrainWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.entrain
        PRODUCT_NAME: Entrain
        TARGETED_DEVICE_FAMILY: "1,2"

  EntrainWidgetiOS:
    templates: [SharedWidget]
    platform: iOS
    info:
      path: iOS/Widget.plist
    entitlements:
      path: iOS/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.no.espenbye.entrain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.entrain.widget
        TARGETED_DEVICE_FAMILY: "1,2"

  # Embedded in the iOS app, runs on its own. The watch has its own
  # session and engine; it plays through paired headphones.
  EntrainWatch:
    templates: [SharedApp]
    platform: watchOS
    sources:
      - Sources/App/watchOS
      - Sources/UI/watchOS
    info:
      path: watchOS/Info.plist
      properties:
        CFBundleDisplayName: Entrain
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: no.espenbye.entrain
        # workout-processing keeps the heart sensor streaming through a
        # Meditate or Relax session; no workout is ever saved.
        WKBackgroundModes: [audio, workout-processing]
        NSHealthUpdateUsageDescription: Entrain logs Meditate sessions as mindful minutes.
        NSHealthShareUsageDescription: Entrain reads your recent sleep so Wind Down and the sleep beds follow your own bedtime, your resting heart rate and heart rate variability so it can tell an ordinary day from a tired one, and your heart rate during a session. Nothing leaves the watch.
        NSLocationWhenInUseUsageDescription: Follows local sunrise and sunset. Only an approximate location is used, and it never leaves the watch.
        NSLocationDefaultAccuracyReduced: true
    entitlements:
      path: watchOS/Entrain.entitlements
      properties:
        com.apple.security.application-groups: [group.no.espenbye.entrain]
        com.apple.developer.healthkit: true
        # Clinical health records only; see the iOS target. Entrain reads none.
        com.apple.developer.healthkit.access: []
        # iCloud key-value store only in AppStore/EntrainWatch.entitlements, as on iOS.
    dependencies:
      - target: EntrainWidgetWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.entrain.watchkitapp
        PRODUCT_NAME: Entrain

  EntrainWidgetWatch:
    templates: [SharedWidget]
    platform: watchOS
    info:
      path: watchOS/Widget.plist
    entitlements:
      path: watchOS/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.no.espenbye.entrain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.entrain.watchkitapp.widget

  EntrainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Entrain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.espenbye.entrain.tests
        GENERATE_INFOPLIST_FILE: true
        # The DSP under test lives in the app module, but the meters here
        # run millions of samples; keep the harness itself optimized.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
