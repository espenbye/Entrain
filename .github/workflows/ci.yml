name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Entrain.xcodeproj -scheme Entrain -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - run: xcodebuild -project Entrain.xcodeproj -scheme EntrainiOS -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
